[project]
name = "car-market"
version = "0.3.0rc1"
requires-python = ">=3.12,<3.13"
description = "Configurable vehicle market monitoring with evidence and price history"
dependencies = [
    "beautifulsoup4==4.15.0",
    "defusedxml==0.7.1",
    "portalocker==3.2.0",
]

[project.optional-dependencies]
browser = ["playwright==1.63.0"]
reports = ["matplotlib==3.10.9", "pillow==12.3.0"]

[project.scripts]
car-market = "car_market.portable:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["car_market*"]

[dependency-groups]
dev = ["pytest>=8.4.0", "pypdf==6.19.0"]

[tool.setuptools.package-data]
car_market = ["assets/fonts/*.ttf", "assets/fonts/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
