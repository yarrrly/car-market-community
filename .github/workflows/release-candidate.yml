name: Release candidate images
on:
  push:
    branches: ["release-community-preview-*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shell-launchers:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.22"
      - run: uv sync --frozen --group dev
      - run: uv run --no-sync pytest tests/test_release_launchers.py -q
      - run: uv run --no-sync python -c "import platform; print(platform.platform(), platform.machine())"
  powershell-launcher:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Native PowerShell control, mocked Docker
        shell: pwsh
        run: ./release/check_powershell.ps1
      - shell: pwsh
        run: $PSVersionTable | Format-List
  native-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build native candidate
        run: |
          docker build --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.licenses=MIT \
            -t car-market:candidate .
      - name: Verify installed image offline
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          python3 release/smoke_image.py --image car-market:candidate --architecture ${{ matrix.architecture }} --expected-version "$version" --output "$RUNNER_TEMP/image-proof"
      - name: Package tested image
        shell: bash
        run: |
          set -euo pipefail
          docker save car-market:candidate | gzip -1 > "$RUNNER_TEMP/car-market-${{ matrix.architecture }}.tar.gz.partial"
          mv "$RUNNER_TEMP/car-market-${{ matrix.architecture }}.tar.gz.partial" "$RUNNER_TEMP/car-market-${{ matrix.architecture }}.tar.gz"
          cd "$RUNNER_TEMP"
          sha256sum car-market-${{ matrix.architecture }}.tar.gz > car-market-${{ matrix.architecture }}.sha256
      - name: Candidate artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: car-market-${{ matrix.architecture }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/car-market-${{ matrix.architecture }}.tar.gz
            ${{ runner.temp }}/car-market-${{ matrix.architecture }}.sha256
            ${{ runner.temp }}/image-proof/
          compression-level: 0
          retention-days: 7
